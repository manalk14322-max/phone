<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Admin Orders | The World Mobile</title>
  <link rel="stylesheet" href="styles.css?v=20260308-9" />
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="index.html">
        <img src="logo.png" alt="The World Mobile" />
        <span>The World Mobile</span>
      </a>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="store.html">Store</a>
        <a href="contacto.html">Nuestro Contacto</a>
        <a href="novedades.html">NOVEDADES</a>
        <a href="oferta.html">OFERTA</a>
      </nav>
      <div class="lang-switch" aria-label="Language switch">
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <a class="profile-btn" href="index.html" aria-label="Home">Home</a>
    </div>
  </header>

  <main class="container page-main">
    <section class="page-hero">
      <p class="page-kicker">Admin</p>
      <h1>Online Orders</h1>
      <p>All customer orders placed from cart checkout.</p>
    </section>

    <section class="contact-card">
      <div class="admin-head-row">
        <h3 style="margin:0;">Order List</h3>
        <button id="admin-orders-clear" class="btn" type="button">Clear Orders</button>
      </div>
      <div style="overflow:auto;">
        <table style="width:100%; border-collapse:collapse;">
          <thead>
            <tr>
              <th style="text-align:left; padding:8px; border-bottom:1px solid #d7e4f8;">Order ID</th>
              <th style="text-align:left; padding:8px; border-bottom:1px solid #d7e4f8;">Customer</th>
              <th style="text-align:left; padding:8px; border-bottom:1px solid #d7e4f8;">Phone</th>
              <th style="text-align:left; padding:8px; border-bottom:1px solid #d7e4f8;">City</th>
              <th style="text-align:left; padding:8px; border-bottom:1px solid #d7e4f8;">Payment</th>
              <th style="text-align:left; padding:8px; border-bottom:1px solid #d7e4f8;">Total</th>
              <th style="text-align:left; padding:8px; border-bottom:1px solid #d7e4f8;">Date</th>
            </tr>
          </thead>
          <tbody id="admin-orders-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="site-pages.js?v=20260308-9"></script>
  <script src="lang-switch.js?v=20260308-9"></script>
</body>
</html>
